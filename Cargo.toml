[workspace]
resolver = "2"
members = [
    "crates/gc",
    "crates/gc-core",
    "crates/gc-cli",
    "crates/gc-mcp",
    "crates/gc-repo",
    "crates/gc-pr",
    "crates/gc-issues",
    "crates/gc-grep",
    "crates/gc-search",
    "crates/gc-skill",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://gitcode.com/ghhhJoshrjnrhr/gc"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
dirs = "5.0"
base64 = "0.22"
percent-encoding = "2"
regex = "1.13.1"
rayon = "1.12.0"
tokio = { version = "1.40", features = ["full"] }

# 内部 crate
gc-core = { path = "crates/gc-core" }
gc-cli = { path = "crates/gc-cli" }
gc-mcp = { path = "crates/gc-mcp" }
gc-repo = { path = "crates/gc-repo" }
gc-pr = { path = "crates/gc-pr" }
gc-issues = { path = "crates/gc-issues" }
gc-grep = { path = "crates/gc-grep" }
gc-search = { path = "crates/gc-search" }
gc-skill = { path = "crates/gc-skill" }
