[package]
name = "gc"
version = "0.1.0"
edition = "2021"
description = "GitCode (AtomGit) 命令行工具，类似 gh"
license = "MIT"
repository = "https://gitcode.com/ghhhJoshrjnrhr/gc"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
rpassword = "1.0"
indicatif = "0.17"
base64 = "0.22"
percent-encoding = "2"
libreditor = { path = "../reditor/libreditor", version = "0.1.0" }
crossterm = { version = "0.27", features = ["event-stream", "bracketed-paste"] }
