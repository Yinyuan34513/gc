[workspace]
resolver = "2"
members = [
    "crates/gc",
    "crates/gc-core",
    "crates/gc-cli",
    "crates/gc-mcp",
    "crates/gc-repo",
    "crates/gc-pr",
    "crates/gc-issues",
    "crates/gc-grep",
    "crates/gc-search",
    "crates/gc-skill",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://gitcode.com/ghhhJoshrjnrhr/gc"
keywords = ["gitcode", "atomgit", "cli", "git", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
dirs = "5.0"
base64 = "0.22"
percent-encoding = "2"
regex = "1.13.1"
rayon = "1.12.0"
tokio = { version = "1.40", features = ["full"] }

# 内部 crate（version 供 crates.io 发布时把 path 依赖替换为 registry 依赖）
gc-core = { path = "crates/gc-core", version = "0.1.3" }
gc-cli = { path = "crates/gc-cli", version = "0.1.3" }
gc-mcp = { path = "crates/gc-mcp", version = "0.1.3" }
gc-repo = { path = "crates/gc-repo", version = "0.1.3" }
gc-pr = { path = "crates/gc-pr", version = "0.1.3" }
gc-issues = { path = "crates/gc-issues", version = "0.1.3" }
gc-grep = { path = "crates/gc-grep", version = "0.1.3" }
gc-search = { path = "crates/gc-search", version = "0.1.3" }
gc-skill = { path = "crates/gc-skill", version = "0.1.3" }
